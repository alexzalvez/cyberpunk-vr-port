name: Build Cyberpunk VR Mod

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  CMAKE_BUILD_PARALLEL_LEVEL: "4"

jobs:
  build:
    name: Build & Package (Release x64)
    runs-on: windows-latest

    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore Build & Cargo Cache
        id: cache-restore
        uses: actions/cache/restore@v4
        with:
          path: |
            build
            ~/.cargo/registry
            ~/.cargo/git
          key: cpvr-build-${{ runner.os }}-${{ hashFiles('CMakeLists.txt', '.gitmodules', 'cmake/**') }}-${{ github.sha }}
          restore-keys: |
            cpvr-build-${{ runner.os }}-${{ hashFiles('CMakeLists.txt', '.gitmodules', 'cmake/**') }}-
            cpvr-build-${{ runner.os }}-

      - name: Configure CMake (with MSVC /MP)
        run: |
          cmake -B build -A x64 -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_FLAGS="/MP" -DCMAKE_C_FLAGS="/MP"

      - name: Compile Mod
        run: |
          cmake --build build --config Release --parallel

      - name: Save Build & Cargo Cache (Even on Failure)
        uses: actions/cache/save@v4
        if: always() && steps.cache-restore.outputs.cache-matched-key != steps.cache-restore.outputs.cache-primary-key
        with:
          path: |
            build
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ steps.cache-restore.outputs.cache-primary-key }}

      - name: Package Distribution (Flat Directory for Single-Zip Artifact)
        shell: pwsh
        run: |
          pwsh scripts/build_dist.ps1 -BuildDir "build" -Force

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CyberpunkVRPort-0.2.3-Optimized
          path: dist/CyberpunkVRPort-0.2.3/*
          if-no-files-found: error